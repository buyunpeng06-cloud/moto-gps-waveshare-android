name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build shared core and host tests
        run: |
          cmake -S . -B build/native -DMOTO_BUILD_WEB=OFF -DMOTO_BUILD_TESTS=ON
          cmake --build build/native --parallel 4
          ctest --test-dir build/native --output-on-failure
      - name: Backend tests (no live API)
        run: |
          npm ci --prefix backend
          npm --prefix backend test
      - name: Verify public map fixtures
        run: |
          node scripts/generate_jinan_demo_fixture.mjs --check
          node scripts/offline_map/validate_jinan_sqlite.mjs

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Workers build and runtime tests (local R2, no credentials)
        run: |
          npm ci --prefix backend
          npm ci --prefix backend/cloudflare
          npm test --prefix backend/cloudflare

  swift-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Swift core tests (no signing or device)
        run: swift test --package-path platforms/ios

  android-community-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # Transitional bootstrap: the current development environment had no
      # Gradle distribution from which to generate and verify the wrapper JAR.
      # Once gradle-wrapper.jar/scripts are checked in, remove this bootstrap
      # and invoke ./gradlew directly from the clean checkout.
      - name: Bootstrap Gradle Wrapper for this CI run
        working-directory: platforms/android
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin
      - name: Build Android debug APK
        working-directory: platforms/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Android unit tests
        working-directory: platforms/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Android lint
        working-directory: platforms/android
        run: ./gradlew --no-daemon :app:lintDebug
